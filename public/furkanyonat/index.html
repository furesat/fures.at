    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0D0D0F;
        --bg-image-url: url('https://images.unsplash.com/photo-1588295982237-62b4193574d6?auto=format&fit=crop&q=80&w=2000');
        --primary-text: #F3F4F6;
        --secondary-text: #D1D5DB;
        --card-bg: rgba(16, 24, 39, 0.82);
        --card-border: rgba(255, 255, 255, 0.18);
        --card-shadow: rgba(0, 0, 0, 0.3);
        --accent-gradient: linear-gradient(90deg, #1e3a8a, #3b82f6); /* New Blue Gradient */
        --accent-glow: rgba(59, 130, 246, 0.25); /* New Blue Glow */
        --highlight-gradient: linear-gradient(90deg, #2563eb, #06b6d4); /* New Blue to Cyan Gradient */
        --active-pill-bg: rgba(255, 255, 255, 0.2);
        --active-pill-text: #FFFFFF;
      }
      html.light {
        --bg-color: #F5F5F7;
        --bg-image-url: none;
        --primary-text: #1D1D1F;
        --secondary-text: #424245;
        --card-bg: rgba(255, 255, 255, 0.86);
        --card-border: rgba(0, 0, 0, 0.14);
        --card-shadow: rgba(0, 0, 0, 0.12);
        --accent-gradient: linear-gradient(90deg, #0066CC, #007AFF);
        --accent-glow: rgba(0, 122, 255, 0.20);
        --highlight-gradient: linear-gradient(90deg, #0066CC, #5AC8FA);
        --active-pill-bg: rgba(0, 122, 255, 0.14);
        --active-pill-text: #1D1D1F;
        --tag-bg: rgba(0, 122, 255, 0.12);
        --tag-border: rgba(0, 122, 255, 0.26);
        --tag-text: #004F9F;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--secondary-text);
        background-image: var(--bg-image-url);
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        transition: background-color 0.5s ease-in-out, color 0.5s ease-in-out;
      }
      
      #background-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        background-color: rgba(13, 13, 15, 0.7);
        backdrop-filter: blur(10px) brightness(0.6);
        -webkit-backdrop-filter: blur(10px) brightness(0.6);
        transition: background-color 0.5s ease-in-out, backdrop-filter 0.5s ease-in-out;
      }

      html.light #background-overlay {
        background:
          radial-gradient(circle at 18% 8%, rgba(0, 122, 255, 0.12), transparent 30%),
          radial-gradient(circle at 82% 18%, rgba(90, 200, 250, 0.16), transparent 34%),
          linear-gradient(180deg, rgba(245, 245, 247, 0.94), rgba(245, 245, 247, 0.98));
        backdrop-filter: blur(10px) brightness(1.04);
        -webkit-backdrop-filter: blur(10px) brightness(1.04);
      }

      .font-display { font-family: 'Space Grotesk', sans-serif; }

      .text-primary-text { color: var(--primary-text); }
      .text-secondary-text { color: var(--secondary-text); }

      .skip-link {
        position: fixed;
        left: 1rem;
        top: 1rem;
        z-index: 9999;
        transform: translateY(-150%);
        background: var(--primary-text);
        color: var(--bg-color);
        padding: 0.75rem 1rem;
        border-radius: 9999px;
        font-weight: 700;
        transition: transform 0.2s ease;
      }
      .skip-link:focus { transform: translateY(0); }

      .glass-card {
        background: linear-gradient(135deg, var(--card-bg), rgba(59, 130, 246, 0.08));
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--card-border);
        box-shadow: 0 8px 32px 0 var(--card-shadow);
        transition: background-color 0.5s ease-in-out, border-color 0.5s ease-in-out, transform 0.3s ease;
        position: relative;
        z-index: 1;
        overflow: hidden;
      }
      
      html.light .glass-card {
        background: linear-gradient(135deg, var(--card-bg), rgba(0, 122, 255, 0.06));
      }

      .active-pill-button {
        background-color: var(--active-pill-bg);
        color: var(--active-pill-text);
      }

      .project-tag {
        background-color: var(--tag-bg, rgba(37, 99, 235, 0.25));
        border: 1px solid var(--tag-border, rgba(147, 197, 253, 0.18));
        color: var(--tag-text, #DBEAFE);
      }

      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        justify-content: center;
      }
      .btn-primary {
        background: var(--accent-gradient);
        color: white;
        box-shadow: 0 4px 15px 0 var(--accent-glow);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px 0 var(--accent-glow);
      }
      .btn-secondary {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        color: var(--primary-text);
      }
      .btn-secondary:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.2);
      }
      html.light .btn-secondary {
        color: var(--primary-text)
      }
      html.light .btn-secondary:hover {
        background: rgba(0,0,0,0.05);
        border-color: rgba(0,0,0,0.15);
      }

      /* Scrollbar styles */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      html.light ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
      }
      html.light ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.3);
      }

      @media print {
        :root {
          --bg-color: #ffffff;
          --primary-text: #000000;
          --secondary-text: #333333;
          --card-border: #dddddd;
        }
        body { background: var(--bg-color) !important; background-image: none !important; }
        #background-overlay { display: none; }
        .glass-card {
          background: #ffffff !important; border: 1px solid var(--card-border) !important;
          box-shadow: none !important; backdrop-filter: none !important;
        }
        .no-print { display: none !important; }
      }
    </style>
